{% extends "app/base.html" %}
{% block content %}
<div class="page-head"><div><h1 class="page-title">Tham số hệ thống</h1><div class="page-sub">Ngưỡng duyệt, cảnh báo và tham số tính toán. Giá trị trong bảng ghi đè mặc định.</div></div></div>
<form method="post" class="card">{% csrf_token %}
  <table class="tbl">
    <thead><tr><th>Mã tham số</th><th>Mặc định</th><th style="width:260px">Giá trị hiện hành</th></tr></thead>
    <tbody>{% for r in rows %}
      <tr><td><code>{{ r.key }}</code></td><td class="text-muted">{{ r.default }}</td><td><input class="input input-sm" name="{{ r.key }}" value="{{ r.value }}"></td></tr>
    {% endfor %}</tbody>
  </table>
  <div class="card-body"><button class="btn btn-primary">Lưu tham số</button></div>
</form>
{% endblock %}
