{% extends "app/base.html" %}
{% block content %}
<div class="page-head"><div><h1 class="page-title">Tài khoản của tôi</h1><div class="page-sub">{{ user.username }} · {{ user.get_role_display }}</div></div></div>
<div class="card card-body" style="max-width:520px">
  <form method="post">{% csrf_token %}
    {% for f in form %}<div class="field" style="margin-bottom:14px"><label>{{ f.label }}</label>{{ f }}{{ f.errors }}</div>{% endfor %}
    <button class="btn btn-primary">Đổi mật khẩu</button>
  </form>
</div>
{% endblock %}
